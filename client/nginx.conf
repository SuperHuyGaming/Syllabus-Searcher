# Plays the role CloudFront has in the AWS setup: static files plus /api/* to the API.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads are capped at 4 MB by the API; leave a little room.
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        # The API reads the visitor's IP from the header CloudFront sets in AWS.
        # nginx overwrites it, so visitors can't fake it.
        proxy_set_header CloudFront-Viewer-Address $remote_addr:$remote_port;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths load index.html and React Router takes over.
    location / {
        try_files $uri /index.html;
    }
}
