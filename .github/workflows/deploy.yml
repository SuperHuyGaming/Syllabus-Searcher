# Deploys to AWS: Lambda API + DynamoDB + CloudFront (infra/template.yaml), then the website to S3.
#
#   develop -> staging     (stack syllabus-searcher-staging, database syllabus_searcher_staging)
#   main    -> production  (stack syllabus-searcher,         database syllabus_searcher)
#
# Runs after CI passes on a push to either branch, or by hand from the Actions tab.
# Each GitHub environment ("staging", "production") holds its own secrets (docs/DEPLOY.md);
# until they're set, the deploy is skipped instead of failing.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy the selected branch
        type: choice
        options: [staging, production]
        default: staging

jobs:
  target:
    # Only after a successful CI run for a push (not a pull request), or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - id: pick
        env:
          MANUAL: ${{ inputs.environment }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -n "$MANUAL" ]; then env="$MANUAL"
          elif [ "$BRANCH" = "main" ]; then env=production
          else env=staging; fi
          echo "environment=$env" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: target
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.environment }}
    concurrency: deploy-${{ needs.target.outputs.environment }}
    env:
      # Free-plan AWS accounts are locked to one region (this one: Ohio). Set the repo
      # variable AWS_REGION to change it; Atlas can stay in another region.
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      STACK: ${{ needs.target.outputs.environment == 'production' && 'syllabus-searcher' || 'syllabus-searcher-staging' }}
      MONGODB_DB: ${{ needs.target.outputs.environment == 'production' && 'syllabus_searcher' || 'syllabus_searcher_staging' }}
    steps:
      - name: Check secrets
        id: check
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
        run: |
          # Deploy only once every required secret is set (Azure ones are optional).
          missing=""
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY MONGODB_URI SUPABASE_URL SUPABASE_ANON_KEY                       SUPABASE_SERVICE_ROLE_KEY ADMIN_EMAILS ORIGIN_SECRET IP_HASH_SALT; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice::The '${{ needs.target.outputs.environment }}' environment is missing:$missing. Nothing was deployed; see docs/DEPLOY.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.ready == 'true'
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-node@v7
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: aws-actions/setup-sam@v3
        if: steps.check.outputs.ready == 'true'
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.check.outputs.ready == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy API, database and CloudFront
        if: steps.check.outputs.ready == 'true'
        working-directory: infra
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          AZURE_DI_ENDPOINT: ${{ secrets.AZURE_DI_ENDPOINT }}
          AZURE_DI_KEY: ${{ secrets.AZURE_DI_KEY }}
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
        run: |
          # SAM rejects "Name=" with an empty value, so optional settings that
          # aren't set (e.g. Azure) are left out and the template defaults apply.
          params=()
          add() { if [ -n "$2" ]; then params+=("$1=$2"); fi; }
          add MongoDbUri "$MONGODB_URI"
          add MongoDbName "$MONGODB_DB"
          add SupabaseUrl "$SUPABASE_URL"
          add SupabaseServiceRoleKey "$SUPABASE_SERVICE_ROLE_KEY"
          add AdminEmails "$ADMIN_EMAILS"
          add AzureDiEndpoint "$AZURE_DI_ENDPOINT"
          add AzureDiKey "$AZURE_DI_KEY"
          add OriginSecret "$ORIGIN_SECRET"
          add IpHashSalt "$IP_HASH_SALT"
          add ReservedConcurrency "${{ vars.RESERVED_CONCURRENCY || 0 }}"
          sam build
          sam deploy --no-progressbar --region "$AWS_REGION" --stack-name "$STACK" --parameter-overrides "${params[@]}"

      - name: Read stack outputs
        if: steps.check.outputs.ready == 'true'
        id: stack
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "bucket=$(out SiteBucketName)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(out DistributionId)" >> "$GITHUB_OUTPUT"
          echo "url=$(out SiteUrl)" >> "$GITHUB_OUTPUT"

      - name: Build website
        if: steps.check.outputs.ready == 'true'
        working-directory: client
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Upload website
        if: steps.check.outputs.ready == 'true'
        working-directory: client/dist
        run: |
          # Hashed assets never change; index.html must always be re-checked.
          aws s3 sync . "s3://${{ steps.stack.outputs.bucket }}" --delete \
            --exclude index.html --cache-control "public, max-age=31536000, immutable"
          aws s3 cp index.html "s3://${{ steps.stack.outputs.bucket }}/index.html" \
            --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${{ steps.stack.outputs.distribution }}" \
            --paths "/index.html" > /dev/null

      - if: steps.check.outputs.ready == 'true'
        run: echo "Deployed ${{ needs.target.outputs.environment }} to ${{ steps.stack.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
