# Re-scrapes GMU syllabi (CS, and Math through scraper/syllabus_scraper/listings.py) and every school's course
# catalog into the cloud stores (DynamoDB + MongoDB Atlas) every week, for both environments. Each environment
# skips quietly until its secrets exist. Syllabus files go to the storage pool: MONGODB_URI, then the optional
# MONGODB_URI_2 and MONGODB_URI_3 clusters. Staging keeps only a sample (STORAGE_BUDGET_MB, default 120 MB),
# so production gets the space.
name: Scrape syllabi
# Manual runs (and "Refresh now" on /admin) name the site, so the admin page can find its own run.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Scrape syllabi ({0})', inputs.environment) || 'Scrape syllabi' }}

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment's databases to fill
        type: choice
        options: [production, staging]
        default: production
      since:
        description: Oldest CS term to scrape
        default: Fall 2022
      sources:
        description: Syllabus sources (cs, math, science)
        default: cs,math,science
      limit:
        description: Most new files per source this run (0 = no limit)
        default: '400'
      catalog:
        description: Also reload every school's course catalog
        type: boolean
        default: true

jobs:
  scrape:
    runs-on: ubuntu-24.04  # Playwright 1.52 installs Chromium on 24.04, not 26.04
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["production","staging"]') }}
    environment: ${{ matrix.environment }}
    # One scrape per site at a time; a second one waits for the first.
    concurrency: scrape-${{ matrix.environment }}
    steps:
      - name: Check secrets
        id: check
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: echo "ready=${{ env.MONGODB_URI != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-python@v7
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Scrape
        if: steps.check.outputs.ready == 'true'
        working-directory: scraper
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_URI_2: ${{ secrets.MONGODB_URI_2 }}
          MONGODB_URI_3: ${{ secrets.MONGODB_URI_3 }}
          STORAGE_BUDGET_MB: ${{ vars.STORAGE_BUDGET_MB || (matrix.environment == 'staging' && '120' || '') }}
          # Same names the deploy workflow gives each environment's stack and database.
          MONGODB_DB: ${{ matrix.environment == 'production' && 'syllabus_searcher' || 'syllabus_searcher_staging' }}
          TABLE_NAME: ${{ matrix.environment == 'production' && 'syllabus-searcher-catalog' || 'syllabus-searcher-staging-catalog' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          python scrape.py --since "${{ inputs.since || 'Fall 2022' }}" --sources "${{ inputs.sources || 'cs,math,science' }}" --limit "${{ inputs.limit || '400' }}" ${{ inputs.catalog == false && '--no-catalog' || '' }}
