# Re-scrapes GMU CS syllabi into the cloud stores (DynamoDB + MongoDB Atlas) every week.
# Skips quietly until the deploy secrets exist.
name: Scrape syllabi

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      since:
        description: Oldest term to scrape
        default: Fall 2022

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: echo "ready=${{ env.MONGODB_URI != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-python@v7
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Scrape
        if: steps.check.outputs.ready == 'true'
        working-directory: scraper
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TABLE_NAME: syllabus-searcher-catalog
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          python scrape.py --since "${{ inputs.since || 'Fall 2022' }}"
