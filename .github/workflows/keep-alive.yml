# Supabase pauses free projects after a week without activity. Hitting /api/health
# touches Supabase, MongoDB Atlas and DynamoDB every few days so nothing goes to sleep.
# Turn it on per environment by setting the environment variable SITE_URL
# (e.g. https://d123.cloudfront.net) on "production" and "staging".
name: Keep alive

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [production, staging]
    environment: ${{ matrix.environment }}
    steps:
      - name: Ping /api/health
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::notice::SITE_URL isn't set for ${{ matrix.environment }} yet; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 "$SITE_URL/api/health"
